name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ecoforecaster-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -r backend/requirements-runtime.txt pytest

      - name: Test backend
        working-directory: backend
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          required=(
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP ACR_NAME IMAGE_NAME
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions repository variable: $name"
              exit 1
            fi
          done
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push immutable image
        run: |
          IMAGE="$ACR_SERVER/$IMAGE_NAME:$GITHUB_SHA"
          docker build --file Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          acrName: ${{ env.ACR_NAME }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Verify production health and prediction
        shell: bash
        run: |
          FQDN=$(az resource show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --resource-type Microsoft.App/containerApps \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          URL="https://$FQDN"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 30 "$URL/system/health" > health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Container App did not become healthy in time."
              exit 1
            fi
            sleep 10
          done
          python -c "import json; h=json.load(open('health.json')); assert h['status']=='healthy'; assert all(h['models_loaded'].values())"
          curl --fail --silent --show-error --max-time 30 \
            --header 'Content-Type: application/json' \
            --data '{"features":[{}]}' \
            "$URL/predict" > prediction.json
          python -c "import json; p=json.load(open('prediction.json')); assert len(p['predictions'])==1"
          curl --fail --silent --show-error --max-time 30 "$URL/" | grep --quiet 'id="root"'
          echo "Production verification passed: $URL"
